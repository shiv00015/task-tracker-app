version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tasktracker_postgres
    restart: always
    environment:
      POSTGRES_USER: shiv
      POSTGRES_PASSWORD: shiv#123
      POSTGRES_DB: task_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
